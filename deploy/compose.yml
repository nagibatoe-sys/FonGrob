name: fongrob
services:
  db:
    build:
      context: .
      dockerfile: Database.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare.py}
      REST_PASSWORD: ${REST_PASSWORD:?Run prepare.py}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
  auth:
    image: ghcr.io/supabase/gotrue:v2.185.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db/postgres?search_path=auth
      GOTRUE_SITE_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      API_EXTERNAL_URL: ${PUBLIC_URL}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_DISABLE_SIGNUP: "true"
    ports:
      - "127.0.0.1:9999:9999"
  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://fongrob_reader:${REST_PASSWORD}@db/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
  app:
    build:
      context: ..
      args:
        SUPABASE_AUTH_URL: http://auth:9999
        SUPABASE_REST_URL: http://rest:3000
    restart: unless-stopped
    depends_on: [auth, rest]
    environment:
      SUPABASE_AUTH_URL: http://auth:9999
      SUPABASE_REST_URL: http://rest:3000
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
  proxy:
    build:
      context: .
      dockerfile: Proxy.Dockerfile
    restart: unless-stopped
    profiles: [https]
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - certificates:/data
      - caddy_config:/config
volumes:
  database:
  certificates:
  caddy_config:
