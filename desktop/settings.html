<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Настройки ФОНГРОБ</title><style>body{font:16px/1.5 system-ui;background:#0b0f14;color:white;padding:24px}label{display:block;margin:20px 0}input[type=url]{display:block;width:100%;box-sizing:border-box;padding:10px;border-radius:6px;background:#131a22;color:white;border:1px solid #64748b}button{background:#75e5a0;border:0;border-radius:6px;padding:10px 16px;font:inherit;cursor:pointer}#status{min-height:24px}</style><h1>Настройки</h1><form id="settings"><label>Адрес сервера<input id="url" type="url" required placeholder="https://example.com"></label><label><input id="notifications" type="checkbox"> Системные уведомления</label><button>Сохранить</button></form><p id="status" role="status"></p><script>window.fongrobDesktop.getSettings().then(s=>{if(!s)return;document.getElementById('url').value=s.serverUrl;document.getElementById('notifications').checked=s.notificationsEnabled});document.getElementById('settings').addEventListener('submit',async e=>{e.preventDefault();const result=await window.fongrobDesktop.setSettings({serverUrl:document.getElementById('url').value,notificationsEnabled:document.getElementById('notifications').checked});document.getElementById('status').textContent=result?.error||'Настройки сохранены.'})</script></html>
